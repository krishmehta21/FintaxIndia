name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent the 15-minute inactivity spin-down on Render
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to trigger it manually if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          # Pinging the Render URL to keep the instance warm
          curl -s -o /dev/null -w "%{http_code}" https://fintaxindia.onrender.com/
